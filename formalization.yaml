      kernel-verified Positivstellensatz proof in Lean 4 using 3x3 Gram minors.
    author_endorsement: "not-contacted"
  - title: "Aufgabe 167"
    authors:
      - "Heinz Hopf"
      - "Erika Pannwitz"
    type: "paper"
    location: "Jber. Deutsch. Math. Verein. 43 (1934), 114"
