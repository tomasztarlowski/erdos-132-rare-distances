status:
  scope: >-
    Formalized and proved unconditionally: Hopf–Pannwitz (fc_hopf_pannwitz), n = 4 sharpness
    (fc_four_points), g(2) = 5 (no_six_point_two_dist), n = 5 and n = 6 (fc_erdos_fishburn),
    and the m >= 4 regular-polygon moment obstruction (no_regPoly_violator_extension). Proved
    conditionally on explicit unproved hypotheses hwei (Wei's g(6) = 13) and hclass13 (13-point
    <= 6-distance classification with multiplicities <= 15): n = 14 reduction
    (fc_fourteen_of_wei_and_class13). Both n = 14 unconditionally and the general conjecture for
    arbitrary n >= 5 remain open.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Quot.sound", "Classical.choice"]

automation:
  methods:
    - method: "agent"
      framework: "Google Antigravity"
      models:
        - "Gemini (mathematical exploration, Positivstellensatz search, Lean 4 proof engineering, metadata preparation)"
      tool_setup: >-
        Computational certificate discovery via Python/SymPy/mpmath (scripts/scan_erdos_132.py),
        formalized and checked in Lean 4.35.0 against Mathlib v4.35.0.
      prompting_notes: "Author-directed development; all proofs audited with Lean kernel and #print axioms."
  notes: >-
    AI assistance was used for proof search, certificate generation, Lean 4 proof engineering, and
    drafting; the author reviewed the mathematical arguments and verified compilation with zero sorry.

review:
  status: "self-assessed"
  notes: >-
    Verified locally by the author with `lake build Matematyka Challenge Solution` and `#print axioms`
    confirming only propext, Quot.sound, and Classical.choice; not independently peer-reviewed.

acknowledgements: >-
  Lean 4 and Mathlib contributors, Thomas Bloom (erdosproblems.com), and google-deepmind/formal-conjectures.
