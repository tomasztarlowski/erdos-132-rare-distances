    note: "Formalizes the planar diameter multiplicity bound μ(P, diam(P)) <= |P| (fc_hopf_pannwitz)."
    author_endorsement: "not-contacted"
  - title: "A proof of Erdős–Fishburn's conjecture for g(6)=13"
    authors:
