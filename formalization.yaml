      - "Adrian Dumitrescu"
      - "Dingyuan Liu"
    id: "arXiv:2505.04283"
    type: "paper"
    relationship: "background"
    note: "Resolved convex position and 'not too convex' sets; referenced context only."
    author_endorsement: "not-contacted"
  - title: "On distances of low multiplicity: the cases 7 <= n <= 13 of a problem of Erdős"
    authors:
      - "Marche"
    id: "https://github.com/JuanMarchetto/erdos-132-note"
