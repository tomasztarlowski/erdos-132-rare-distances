name = "erdos132"
version = "0.1.0"
keywords = ["math", "erdos", "lean4", "geometry"]
defaultTargets = ["Matematyka", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

[[lean_lib]]
name = "Matematyka"
roots = ["Matematyka.Erdos132"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
